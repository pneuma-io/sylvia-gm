[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
]

markers = [
    "anyio: mark a test as an async test (uses anyio backend)",
    "asyncio: mark a test as an async test (uses asyncio backend)",
    "slow: mark a test as slow (requires network, may be flaky)",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyinstaller>=6.0",
]
