[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sylvia-gm"
version = "0.4.0-alpha.1"
description = "Sylvia GM — source-available AI game-running desktop application"
readme = "README.md"
license = {file = "LICENSE"}
# Standard PolyForm Noncommercial plus separately adopted Sylvia Additional Permissions
# (revision 3, 16 October 2026); see LICENSING-STATUS.md for scope and exclusions.
# Prior grants and third-party terms remain.
requires-python = ">=3.11"
authors = [
    {name = "Daniel Young"}
]
keywords = ["ttrpg", "dungeon-master", "ai", "rpg"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Role-Playing",
]

dependencies = [
    "pyyaml>=6.0",
    "openai>=1.0",
    "anthropic>=0.49,<1.0",
    "httpx>=0.25",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "jsonschema>=4.26.0",
    "mcp==2.0.0",
    "aiohttp>=3.14.1",
    "tiktoken>=0.5.0",
    "pypdf==6.15.0",
    "cryptography>=50,<51",
]

[project.optional-dependencies]
dictation = [
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.3",
    "sounddevice==0.5.6",
    "onnxruntime==1.31.0",
    "av==18.0.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pyinstaller>=6.0",
]

[project.scripts]
sylvia-gm = "sylvia_gm.main:main"
sylvia-gm-owner = "sylvia_gm.interfaces.owner_process:main"

[tool.setuptools]
license-files = ["LICENSE", "COPYRIGHT", "LICENSING-STATUS.md", "SYLVIA-ADDITIONAL-PERMISSIONS.md", "licenses/MIT-PREVIOUS-GRANT.txt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sylvia_gm.campaign" = ["the-rift-awakening.json", "srd-starters.json", "ready-campaigns.json"]
"sylvia_gm.agent" = ["skills/*/SKILL.md", "skills/*/references/*.md", "skills/*/references/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
exclude = [".venv", ".git", "__pycache__", "data", "campaigns"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Temporary: PR6 owns these files; recheck and remove after its merge.
"src/sylvia_gm/agent/_builder_session.py" = ["B023", "E501"]
"src/sylvia_gm/application/authority.py" = ["E501"]
"src/sylvia_gm/application/package_runtime.py" = ["E501", "I001"]
"src/sylvia_gm/application/player_actions.py" = ["E501"]
"src/sylvia_gm/application/tactical_grid.py" = ["E501"]
"src/sylvia_gm/domain/_content_schema_map_card.py" = ["E501"]
"src/sylvia_gm/domain/_content_schema_panel.py" = ["E501"]
"src/sylvia_gm/infrastructure/sqlite_authority.py" = ["F401"]
"src/sylvia_gm/runtime/_effect_executor.py" = ["E501"]
"src/sylvia_gm/runtime/_schema_validator.py" = ["E501"]
"src/sylvia_gm/spatial/_engine.py" = ["B905", "E501"]
"src/sylvia_gm/spatial/_interface.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]


# NumPy's installed stubs use newer syntax than the supported Python target.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

# Measured legacy debt; this exact-module list may only shrink. New modules remain strict.
[[tool.mypy.overrides]]
module = [
    "sylvia_gm.agent._builder_question_answers",
