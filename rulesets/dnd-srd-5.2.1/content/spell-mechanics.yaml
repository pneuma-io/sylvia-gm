    source:
      page: 111
      source_heading: Astral Projection
      next_heading: Augury
      not_yet_mapped:
      - Paid one-hour projection now admits the caster and up to eight actual willing companions within ten
        feet. Materials are consumed per target; each target retains distinct body/form identities and source
        membership. Native HP damage is independent; zero HP queues that target's return after the completed
        action. The casting owner's Magic-action dismissal returns the selected cast's remaining members. This
        is a partial native receiving mapping.
      - Ordinary represented inventory, material supplies, held items and worn equipment are replicated as independent
        entity-owned stocks; native form item use does not change the physical body, and return restores the
        body's actual current stock and equipment. Physical PC bodies retain authenticated native saving-throw
        statistics and cannot act. Departure through existing Travel transports the living original body and
        its current possessions at the actual qualified destination, preserving one canonical relocation; physical/form
        Box geometry must still match. Magical item properties, separately admitted carried/worn scene objects,
        source-owned ongoing body/form effect restoration, other PC passives/resources, changed departure geometry
        and unavailable world destinations remain selected. Existing retained effects, conditions, created actors,
        transformations, possession and replacement bodies reject on the bounded constructor; distinct Box body
        proxies are supported.
      - Silver cord severing requires an actual effect that expressly cuts it; the pinned corpus contains no
        such producer. There is no caller severing verdict. The suspended body retains Unconscious and declarative
        no-food/no-air/no-aging facts; this does not require inventing hunger or aging systems.
      - Generic paid Dispel, Antimagic suppression and exact source retirement beyond native zero-HP return
        and owned Magic dismissal remain selected. Current full Root package/Reaction/receiving composition
        is not claimed by the selected native267 strict public archive journey.
