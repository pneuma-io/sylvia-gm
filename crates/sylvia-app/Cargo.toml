[package]
name = "sylvia-app"
description = "Application services above the store, one module per service family (lanes 1 to 3 by family)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file = "../../LICENSE"
publish.workspace = true

[dependencies]
sylvia-base.workspace = true
sylvia-domain.workspace = true
sylvia-engine.workspace = true
sylvia-store.workspace = true
serde_json.workspace = true
# Python lookaround in the No Ruleset mechanics patterns (docs/rust-port/sites/regex-sites.md).
fancy-regex.workspace = true
# NFC member names in import repair (import_repair.py's unicodedata.normalize). Added by lane 1.
unicode-normalization.workspace = true

[dev-dependencies]
# The vector tests' hooks (`vector-hooks`); never a normal dependency's feature.
sylvia-engine = { workspace = true, features = ["vector-hooks"] }
sylvia-compare = { path = "../sylvia-compare" }
flate2.workspace = true
rusqlite.workspace = true
tokio.workspace = true

[lints]
workspace = true
