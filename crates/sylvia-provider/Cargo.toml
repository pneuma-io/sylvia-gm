[package]
name = "sylvia-provider"
description = "Lane 4: provider event types, transports, model settings and credentials"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file = "../../LICENSE"
publish.workspace = true

[dependencies]
sylvia-base.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures-util.workspace = true
getrandom.workspace = true
sha2.workspace = true
hex.workspace = true
reqwest.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true
aes-gcm.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
futures-util.workspace = true
serde_json.workspace = true

# The account runtimes' process layer. It is also its own stand-in runtime (started with
# --fake-runtime or app-server), which must answer before a test harness reads its arguments.
[[test]]
name = "runtime_process"
harness = false

# Kept processes, the native transcript and the Claude settings. It is also the stand-in for
# Claude Code in the settings cases, which must answer before a test harness reads its arguments.
[[test]]
name = "kept_vectors"
harness = false

# ClaudeProvider. It is also the scripted stand-in Claude Code its cases run against, which must
# answer before a test harness reads its arguments.
[[test]]
name = "claude_provider_vectors"
harness = false

# The ChatGPT account. It is also the stand-in Codex app-server its cases run against, which must
# answer before a test harness reads its arguments.
[[test]]
name = "chatgpt_vectors"
harness = false

# ChatGPTProvider. It is also the scripted app-server its cases run against, which must answer
# before a test harness reads its arguments.
[[test]]
name = "chatgpt_provider_vectors"
harness = false

[lints]
workspace = true
