[package]
name = "sylvia-owner"
description = "Lane 5: the Sylvia GM owner process, the Rust replacement for sylvia_gm.interfaces.owner_process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file = "../../LICENSE"
publish.workspace = true

[[bin]]
name = "sylvia-gm-owner"
path = "src/main.rs"

[[bin]]
name = "sylvia-gm"
path = "src/bin/sylvia-gm.rs"

# Starts a copy of itself as a stand-in installer, which must answer before a test harness
# reads its arguments.
[[test]]
name = "nsis_command_line"
harness = false

# Runs the real WebUI host with itself as the stand-in owner, which must answer before a test
# harness reads its arguments.
[[test]]
name = "webui_files"
harness = false

[dependencies]
sylvia-base.workspace = true
serde_json.workspace = true
hex.workspace = true
tokio.workspace = true
serde.workspace = true
getrandom.workspace = true
futures-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
multer.workspace = true
bytes.workspace = true
regex.workspace = true
sha2.workspace = true
sylvia-domain.workspace = true
sylvia-store.workspace = true
sylvia-provider.workspace = true
sylvia-agent.workspace = true
ed25519-dalek.workspace = true
unicode-normalization.workspace = true
rusqlite.workspace = true

[target.'cfg(windows)'.dependencies]
windows-version.workspace = true
winapi-util.workspace = true
# The desktop update helper's direct Windows calls (`desktop_update/windows.rs`).
windows-sys = { workspace = true, features = ["Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_Controls"] }

[target.'cfg(not(windows))'.dependencies]
rustix.workspace = true

[dev-dependencies]
flate2.workspace = true

[lints]
workspace = true
