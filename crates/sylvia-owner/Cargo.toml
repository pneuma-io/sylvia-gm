[package]
name = "sylvia-owner"
description = "Lane 5: the Sylvia GM owner process, the Rust replacement for sylvia_gm.interfaces.owner_process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file = "../../LICENSE"
publish.workspace = true

[[bin]]
name = "sylvia-gm-owner"
path = "src/main.rs"

[[bin]]
name = "sylvia-gm"
path = "src/bin/sylvia-gm.rs"

# Starts a copy of itself as a stand-in installer, which must answer before a test harness
# reads its arguments.
[[test]]
name = "nsis_command_line"
harness = false

# Runs the real WebUI host with itself as the stand-in owner, which must answer before a test
# harness reads its arguments.
[[test]]
name = "webui_files"
harness = false

# Dictation against the native libraries the product ships (Windows): runs itself again under
# each OpenBLAS thread setting, before the library loads. Never part of check.sh; see the
# dictation check in docs/rust-port/README.md.
[[test]]
name = "dictation_native"
harness = false
required-features = ["dictation"]

# The engine across the C++ boundary against the shipped CTranslate2 (Windows, `dictation`).
[[test]]
name = "dictation_engine"
harness = false
required-features = ["dictation"]

# Whole transcriptions on the shipped natives against faster-whisper (Windows, `dictation`).
[[test]]
name = "dictation_transcribe"
harness = false
required-features = ["dictation"]

# The device-id migration on this machine's own devices (Windows, `dictation`).
[[test]]
name = "dictation_devices"
harness = false
required-features = ["dictation"]

# A whole dictation through the worker's recording path (Windows, `dictation`).
[[test]]
name = "dictation_recording"
harness = false
required-features = ["dictation"]

[features]
# faster-whisper dictation on its native libraries (CTranslate2, ONNX Runtime, NumPy's OpenBLAS,
# the LGPL libswresample), Windows only. Off by default: the normal build and check.sh never
# build or load them.
dictation = ["dep:ct2rs", "dep:ort", "dep:tokenizers", "dep:flate2", "dep:cpal"]

[dependencies]
sylvia-base.workspace = true
serde_json.workspace = true
hex.workspace = true
tokio.workspace = true
serde.workspace = true
getrandom.workspace = true
futures-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
multer.workspace = true
bytes.workspace = true
regex.workspace = true
sha2.workspace = true
sylvia-domain.workspace = true
sylvia-store.workspace = true
sylvia-app.workspace = true
sylvia-provider.workspace = true
sylvia-agent.workspace = true
ed25519-dalek.workspace = true
unicode-normalization.workspace = true
rusqlite.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true

[target.'cfg(windows)'.dependencies]
ct2rs = { workspace = true, optional = true }
ort = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }
# The compression ratio's zlib (`zlib.compress`), as the dev dependency below.
flate2 = { workspace = true, optional = true }
windows-version.workspace = true
schannel.workspace = true
winapi-util.workspace = true
# The desktop update helper's direct Windows calls (`desktop_update/windows.rs`).
windows-sys = { workspace = true, features = ["Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_Controls"] }

[target.'cfg(not(windows))'.dependencies]
rustix.workspace = true

[dev-dependencies]
flate2.workspace = true
rcgen.workspace = true

[lints]
workspace = true
