[package]
name = "sylvia-engine"
description = "Lane 2: ruleset interpreter, expressions, effects, procedures, dice, spatial engine, state bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file = "../../LICENSE"
publish.workspace = true

[dependencies]
sylvia-base.workspace = true
sylvia-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Python seeds a str or bytes seed with SHA-512; an unseeded stream reads 16 OS bytes.
sha2.workspace = true
getrandom.workspace = true
indexmap.workspace = true

[dev-dependencies]
hex.workspace = true

[features]
# Vector tooling only: `exec::handlers::with_identity_shuffle_for_vectors`, which leaves `shuffle` in
# order. Only test builds enable it, through `[dev-dependencies]`; no product build may
# (`docs/rust-port/check.sh` checks that the owner's dependency graph does not).
vector-hooks = []

[lints]
workspace = true
