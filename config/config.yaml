# Sylvia GM — Default Configuration
# Override: create config.yaml in Sylvia GM's owner data folder or set environment variables
# (SYLVIA_GM_ prefix). The desktop settings surface writes the owner-local file.
# Load order: default (this file) → user config → env vars (highest priority)

app:
  name: "Sylvia GM"
  version: "0.3.0-alpha.1"
  data_dir: "data"
  campaigns_dir: "campaigns"

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  file: "data/sylvia-gm.log"

providers:
  lm_studio:
    enabled: false
    mode: local
    name: "LM Studio"
    base_url: "http://127.0.0.1:1234/v1"
    api_key: ""
    models: []
  opencode_go:
    enabled: false
    mode: byok
    name: "OpenCode Go"
    base_url: "https://opencode.ai/zen/go/v1"
    api_key: ""
    models: []
  openai:
    enabled: false
    mode: byok
    name: "OpenAI API"
    base_url: "https://api.openai.com/v1"
    api_key: ""
    models: []

ruleset:
  default: ""
  path: "rulesets"

tts:
  provider: "edge"
  enabled: false
  voice: "en-US-AriaNeural"
  voices:
    dm: "en-US-AriaNeural"
    npc_female: "en-US-JennyNeural"
    npc_male: "en-US-GuyNeural"
