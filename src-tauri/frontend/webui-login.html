<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in to Sylvia GM</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #151923; color: #edf0f6;
      font: 16px/1.5 system-ui, sans-serif; min-height: 100dvh; }
    main { max-width: 440px; margin: 8vh auto; }
    h1 { font-size: 26px; }
    label, input, button { display: block; width: 100%; }
    input, button { font: inherit; min-height: 48px; padding: 10px; margin-top: 8px;
      border: 1px solid #8592aa; border-radius: 6px; }
    input { color: #edf0f6; background: #202736; }
    button { margin-top: 20px; cursor: pointer; background: #d3ddfa; color: #151923; }
    :focus-visible { outline: 3px solid #a4c8ff; outline-offset: 3px; }
    output { display: block; margin-top: 16px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>Sign in to Sylvia GM</h1>
    <p>This private WebUI controls the host's selected Sylvia data. Use the access key
      supplied by its owner.</p>
    <form>
      <label for="access-key">Access key</label>
      <input id="access-key" type="password" autocomplete="current-password" required
        maxlength="128" spellcheck="false" autocapitalize="none">
      <button type="submit">Sign in</button>
      <output role="status" aria-live="polite"></output>
    </form>
  </main>
  <script>
    const form = document.querySelector('form');
    const input = document.getElementById('access-key');
    const button = form.querySelector('button');
    const status = form.querySelector('output');
    form.addEventListener('submit', async event => {
      event.preventDefault(); button.disabled = true; status.textContent = 'Signing in…';
      try {
        const body = JSON.stringify({ key: input.value });
        input.value = '';
        const response = await fetch('/auth/login', { method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json', 'X-Sylvia-WebUI': '1' }, body });
        if (!response.ok) throw new Error(response.status === 429
          ? 'Sign-in limit reached. Wait one minute, or ask the owner to check active sessions.'
          : 'Sign-in failed. Check the access key and try again.');
        location.replace('/app.html');
      } catch (error) {
        status.textContent = error instanceof TypeError
          ? 'Connection interrupted. Sign in again when the connection returns.' : error.message;
        button.disabled = false; input.focus();
      }
    });
  </script>
</body>
</html>
