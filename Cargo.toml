# Sylvia GM Rust port workspace. See docs/rust-port/README.md for lanes, rules and checks.
#
# src-tauri (the desktop shell) stays outside the workspace for now: the release and
# qualification scripts pin its own Cargo.lock and src-tauri/target. Lane 5 joins it to the
# workspace when packaging moves off PyInstaller.
[workspace]
resolver = "2"
members = [
    "crates/sylvia-base",
    "crates/sylvia-domain",
    "crates/sylvia-engine",
    "crates/sylvia-store",
    "crates/sylvia-app",
    "crates/sylvia-provider",
    "crates/sylvia-agent",
    "crates/sylvia-owner",
    "crates/sylvia-compare",
]
exclude = ["src-tauri"]

[workspace.package]
version = "0.4.1"
edition = "2021"
rust-version = "1.89"
authors = ["Daniel Young"]
publish = false

# One pinned set of shared dependencies. A lane that needs a new crate adds it here in its own
# pull request and says why, so two lanes never pull in two libraries for the same job.
[workspace.dependencies]
sylvia-base = { path = "crates/sylvia-base" }
sylvia-domain = { path = "crates/sylvia-domain" }
sylvia-engine = { path = "crates/sylvia-engine" }
sylvia-store = { path = "crates/sylvia-store" }
sylvia-app = { path = "crates/sylvia-app" }
sylvia-provider = { path = "crates/sylvia-provider" }
sylvia-agent = { path = "crates/sylvia-agent" }

# preserve_order: Python dicts keep insertion order and several encodings depend on it.
# float_roundtrip: parse floats exactly, as Python does.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
# SQLite for the store and the comparison tool. 0.34 bundles SQLite 3.49.1, the library the
# Python reference environment ships (sqlite3.sqlite_version); sylvia-store's vector tests
# assert it so a later bump cannot move it silently. `backup` is the online copy the store
# makes before schema migrations. The comparison tool's stand-in model endpoint is std::net.
rusqlite = { version = "0.34", features = ["bundled", "backup"] }
# Store tests only: the Python-made fixture databases are kept gzip-compressed.
flate2 = "1"
# Store safe-file primitives (`infrastructure/safe_file.py`). Linux: safe openat/statat/
# unlinkat/renameat/fsync on descriptors. Windows: handle identity without unsafe code, and the
# three kernel32 calls with no safe binding (GetDriveTypeW, the delete disposition, MoveFileExW).
# Lane 4 adds `process` for `geteuid` (the Linux credential key file checks its owner).
rustix = { version = "1", features = ["fs", "process"] }
# (winapi-util, for handle identity, is declared once below with the owner's use.)
# Lane 4 adds `Win32_Security_Cryptography` and `Win32_Foundation` for current-user DPAPI
# (`CryptProtectData`, `CryptUnprotectData`, `LocalFree`), the saved-credential protection of
# `config/_credential_protection.py` on Windows.
# and `Win32_UI_Shell` (with `Win32_UI_WindowsAndMessaging`, for its show-window type) for
# `ShellExecuteW`, the call `os.startfile` makes to open a setup page or sign-in address in the
# browser (`config/_host_browser.py`).
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Security_Cryptography", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
getrandom = "0.2"
# AES-256-GCM for the Linux saved-credential key file (`config/_credential_protection.py`,
# Python's `cryptography` AESGCM). RustCrypto, pure Rust.
aes-gcm = "0.10"
regex = "1"
# Backtracking regular expressions: lookahead and lookbehind in Python patterns the `regex` crate
# rejects (content schema patterns, docs/rust-port/sites/regex-sites.md). Added by lane 1.
fancy-regex = "0.14"
# NFC checks of package archive member names (`unicodedata.normalize("NFC", name)`). Pinned to
# the release on Unicode 15.0.0, the tables of the CPython 3.12 reference; a test asserts it.
# Added by lane 1.
unicode-normalization = "=0.1.22"
# Owner (lane 5), Windows only: the numeric OS version local diagnostics records
# (`sys.getwindowsversion()`), and file identity and link counts for the desktop update's
# folder checks (`os.stat` st_dev, st_ino and st_nlink), without unsafe code in the owner.
# winapi-util also gives the store's safe-file checks handle identity on Windows (lane 3).
windows-version = "0.1"
winapi-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "process", "net", "signal"] }
# Lane 4: provider streams are pull-based like Python async generators (Stream, StreamExt).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The WebUI host (lane 5): an HTTP/1.1 server with no framework. hyper is the server, hyper-util
# runs it on tokio, http-body-util builds and reads bodies, multer parses multipart uploads as a
# stream, and bytes is the buffer type all four share. Lane 4's reqwest client sits on the same
# hyper and http types.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
multer = "3"
bytes = "1"
# Desktop update (lane 5): verifying the Ed25519 signature on a release manifest, as Python does
# with `cryptography`. Verification only; no signing or key generation in the product.
ed25519-dalek = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Errors in this port carry what the Python exception carried (class, exact message,
# diagnostics, retry hints), so they are larger than clippy's 128-byte guideline. They are
# returned rarely and never in a hot loop; boxing them would only add noise.
result_large_err = "allow"

[profile.dev]
# Engine and comparison runs are slow unoptimised; keep debug assertions.
opt-level = 1

[profile.release]
# Matches the desktop shell: Cargo's normal optimised release profile.
